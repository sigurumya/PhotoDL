<html lang="ja"><head>
    <meta charset="utf-8">
    <title>写真DLサイト</title>
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <meta name="description" content="fotoDL">
    <base href="">
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <div class="page-shell">
      <main class="hero-card" aria-live="polite">
        <div class="eyebrow">Google Drive • JPG Downloader</div>
        <h1>写真DLサイト</h1>
        <p class="subtitle">Google Drive に保存された写真を、すばやく安全にダウンロードできます。</p>

        <div class="status-panel">
          <span class="status-dot" aria-hidden="true"></span>
          <p id="status">ダウンロードする写真を確認しています。</p>
        </div>

        <div class="feature-list" aria-label="サービスの特徴">
          <span>高速</span>
          <span>安全</span>
          <span>簡単</span>
        </div>
      </main>

      <p class="legal-note">本サイトは、Google Driveに保存された写真を簡単にダウンロードできるサービスのみ提供しています。本サイトに写真データは存在しません。</p>
    </div>
    <script>
      const status = document.getElementById("status");
      const pathMatch = window.location.pathname.match(/index\.html\/(.+)$/i);
      const query = window.location.search.slice(1);
      const params = new URLSearchParams(query);
      let requestedFile = params.get("url") || params.get("link") || params.get("file") || params.get("name");

      if (!requestedFile && query) {
        const driveUrlStart = query.search(/https?:\/\/(?:drive|docs)\.google\.com\//i);
        requestedFile = driveUrlStart >= 0 ? query.slice(driveUrlStart) : query.includes("=") ? "" : query;
      }
      if (!requestedFile && pathMatch) {
        requestedFile = pathMatch[1];
      }
      if (!requestedFile && window.location.hash) {
        requestedFile = window.location.hash.slice(1);
      }

      try {
        requestedFile = requestedFile ? decodeURIComponent(requestedFile) : "";
      } catch {
        requestedFile = "";
      }

      let driveFileId = "";
      try {
        const driveUrl = new URL(requestedFile);
        if (/^(drive|docs)\.google\.com$/i.test(driveUrl.hostname)) {
          driveFileId = driveUrl.pathname.match(/\/file\/d\/([^/]+)/)?.[1]
            || driveUrl.pathname.match(/\/document\/d\/([^/]+)/)?.[1]
            || driveUrl.searchParams.get("id")
            || "";
        }
      } catch {
        driveFileId = "";
      }

      const fileName = requestedFile.split(/[\\/?#]/).pop();
      if (driveFileId) {
        status.textContent = "Google Driveからダウンロードしています。";
        window.location.replace(`https://drive.google.com/uc?export=download&id=${encodeURIComponent(driveFileId)}`);
      } else if (fileName && /\.jpe?g$/i.test(fileName)) {
        const link = document.createElement("a");
        link.href = `./${encodeURIComponent(fileName)}`;
        link.download = fileName;
        link.click();
        status.textContent = `${fileName} のダウンロードを開始しました。`;
      } else {
        status.textContent = "URLにJPGファイル名またはGoogle Driveの共有リンクを指定してください。";
      }
    </script>
  </body>
</html>
